  <text x="600" y="355" font-size="150" text-anchor="middle">🏆</text>
  <text x="600" y="472" font-size="52" font-weight="800" font-family="Arial, Helvetica, sans-serif" fill="#0f172a" text-anchor="middle">P1: Mastering Physics</text>
  <text x="600" y="535" font-size="52" font-weight="800" font-family="Arial, Helvetica, sans-serif" fill="#0f172a" text-anchor="middle">Olympiads with RL</text>
